name: Fork CI

# techneissa's fork: run the official CI (`cargo xtask ci`, ci.yml: Linux, plus Windows and web when its platform check asks) on every push to `custom`, on GitHub's
# machines, so the full suite never runs on techneissa's Mac (techneissa, 2026-10-29). ci.yml itself is
# official and only runs on `main` and pull requests; this dispatches it for `custom` without editing it.
# fork-build.yml pushes its daily upstream merge with FORK_PUSH_TOKEN, so that merge is tested too.

on:
  push:
    branches: [custom]
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: fork-ci
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Run CI on custom
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "${{ github.repository }}" --ref custom
