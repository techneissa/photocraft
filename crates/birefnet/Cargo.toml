[package]
name = "photocraft-birefnet"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "BiRefNet (Swin-L backbone, bilateral reference decoder) subject cut-outs in pure Rust on candle: reads the model.safetensors LightCraft shares; the weights are never shipped"

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
serde_json = { workspace = true }

# The model runs natively only (the browser build has no models; see photocraft-ml): on wasm32 only the pure helpers build.
# 0.9.2 exactly, as photocraft-lama, photocraft-sam3 and LightCraft pin it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
candle-core = { version = "=0.9.2", default-features = false }
candle-nn = { version = "=0.9.2", default-features = false }

# Metal (the GPU) on the Mac; every other system runs on the CPU.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "=0.9.2", default-features = false, features = ["metal"] }
candle-nn = { version = "=0.9.2", default-features = false, features = ["metal"] }
