[package]
name = "photocraft-sam3"
version.workspace = true
edition.workspace = true
# Apache-2.0 only (not the workspace's MIT OR Apache-2.0): a port of Hugging Face Transformers' SAM 3 code.
license = "Apache-2.0"
description = "SAM 3 (Segment Anything with Concepts) inference in pure Rust on candle: click and text prompts (L4); the weights are never shipped"

[lints]
workspace = true

# The model runs natively only (the browser build has no models; see photocraft-ml).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
photocraft-ml = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# 0.9.2 exactly, as LightCraft pins it: later releases pull `tokenizers` with the Oniguruma C library into candle-core.
candle-core = { version = "=0.9.2", default-features = false }
candle-nn = { version = "=0.9.2", default-features = false }

# Metal (the GPU) on the Mac; every other system runs on the CPU.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "=0.9.2", default-features = false, features = ["metal"] }
candle-nn = { version = "=0.9.2", default-features = false, features = ["metal"] }
